services:
  - type: web
    name: lattes-facil
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: LATTESFACIL_CODIGO
        sync: false  # defina no painel do Render; nunca no repositório
      - key: LATTESFACIL_HTTPS
        value: "1"
      - key: GEMINI_ENABLED
        value: "0"  # mude para "1" no painel do Render após informar GEMINI_API_KEY
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_MODE
        value: hibrido
      - key: GEMINI_API_KEY
        sync: false  # defina no painel do Render; nunca no repositório
      - key: PYTHON_VERSION
        value: 3.11.8
