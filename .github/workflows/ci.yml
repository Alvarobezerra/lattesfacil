name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # mesma versão do Render (render.yaml)
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Dependências
        run: pip install -r requirements-dev.txt

      - name: Testes
        run: python tests/rodar_todos.py
