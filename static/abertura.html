<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LattesData — Início</title>
<link rel="icon" type="image/svg+xml" href="/img/isotipo.svg" />
<link rel="stylesheet" href="/fonts/fonts.css" />
<style>
:root{--navy:#0b192c;--blue:#1b365d;--cyan:#00a3c4;--cyan-d:#00829c;--emerald:#10b981;--sky:#38bdf8;
  --bg:#f4f8fb;--card:#fff;--border:#dbe4ee;--text:#0b192c;--muted:#546580;--warn:#b7791f;--warn-bg:#fdf6e3;
  --serif:"Newsreader",Georgia,serif;--ui:"Inter","Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#08121f;--card:#0f1f35;--border:#1f3452;--text:#e8eff7;--muted:#93a6c0;--warn-bg:#2a2210;--warn:#e6b559}}
*{box-sizing:border-box}
body{margin:0;font-family:var(--ui);background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}
.wrap{width:min(1240px,100% - 32px);margin:0 auto}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top-in{display:flex;align-items:center;gap:18px;height:62px}
.brand{display:flex;align-items:center;gap:9px}.brand img{width:34px;height:34px}
.wm b{font-family:var(--serif);font-style:italic;font-weight:700;font-size:1.35rem}
.wm i{font-style:normal;font-weight:800;font-size:.75rem;color:var(--cyan);letter-spacing:.06em;margin-left:3px}
.nav{display:flex;gap:4px;margin-left:10px}
.nav a{padding:7px 12px;border-radius:8px;color:var(--muted);font-weight:500;font-size:.9rem}
.nav a.on{background:color-mix(in srgb,var(--cyan) 14%,transparent);color:var(--cyan-d);font-weight:600}
.top-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.top-r a{font-size:.85rem;color:var(--muted)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;display:grid;place-items:center;font-weight:700;font-size:.82rem;flex:none}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:10px;padding:9px 16px;font-weight:600;font-size:.9rem}
.btn-p{background:var(--cyan);color:#04202a;box-shadow:0 6px 16px rgba(0,163,196,.25)}
.btn-o{border-color:var(--border);background:var(--card)}
.profile{display:flex;align-items:center;gap:18px;padding:22px 0 8px;flex-wrap:wrap}
.profile .avatar{width:64px;height:64px;font-size:1.3rem}
.who h1{margin:0;font-size:1.45rem;letter-spacing:-.01em}
.who h1 em{font-family:var(--serif);font-weight:600;color:var(--cyan-d)}
.who p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.ids{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--emerald) 14%,transparent);color:#0a6b4d;border:1px solid color-mix(in srgb,var(--emerald) 35%,transparent)}
@media (prefers-color-scheme:dark){.pill{color:#5be0b0}}
.pill.neutral{background:var(--bg);color:var(--muted);border-color:var(--border)}
.actions{margin-left:auto;display:flex;gap:10px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;padding:14px 0 48px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.card h2{margin:0 0 12px;font-size:.95rem}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;gap:8px;flex-wrap:wrap}.sec-h h2{margin:0}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 11px;font-size:.78rem;color:var(--muted);font-weight:600}
.seg button.on{background:var(--cyan);color:#04202a}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{padding:14px 14px 10px;cursor:pointer;transition:border-color .15s,transform .15s;text-align:left;color:inherit}
.kpi:hover,.kpi.on{border-color:var(--cyan)}.kpi:hover{transform:translateY(-1px)}
.kpi .lb{font-size:.76rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin:4px 0 0;line-height:1.1}
.kpi .d{font-size:.8rem;font-weight:600;color:#0a8a63}
@media (prefers-color-scheme:dark){.kpi .d{color:#5be0b0}}
.kpi .d.flat{color:var(--muted)}
.kpi .sub{font-size:.76rem;color:var(--muted);margin-top:4px}
.chart-card{margin-bottom:16px}
#chart{width:100%;height:210px;display:block}
.chart-foot{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.chart-foot div{font-size:.78rem;color:var(--muted)}.chart-foot b{display:block;font-size:1.15rem;color:var(--text)}
.src{font-size:.74rem;color:var(--muted);margin:10px 0 0}.src b{color:var(--cyan-d)}
.post{display:flex;gap:12px;padding:14px;border:1px solid var(--border);border-radius:12px;margin-top:10px}
.ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:1.05rem;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.post .b{min-width:0;flex:1}.post .t{font-size:.92rem;overflow-wrap:anywhere}.post .t b{font-weight:700}
.post .m{font-size:.76rem;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.post .acts{display:flex;gap:8px;margin-top:10px}
.post .acts a{font-size:.78rem;font-weight:600;border:1px solid var(--border);border-radius:8px;padding:4px 10px;color:var(--cyan-d)}
.post .acts a:hover{border-color:var(--cyan)}
.conf{font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--bg);border:1px solid var(--border);color:var(--muted);margin-left:6px}
.side{display:grid;gap:16px;align-content:start}
.row{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;font-size:.85rem}.row:last-child{margin-bottom:0}
.row .n{font-weight:600;overflow-wrap:anywhere}.row .s{font-size:.76rem;color:var(--muted)}
.row .q{margin-left:auto;font-weight:800;color:var(--cyan-d);white-space:nowrap}
.empty{color:var(--muted);font-size:.86rem;margin:0}
.banner{margin:14px 0 0;padding:12px 16px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:.86rem;border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
form.orcid{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
form.orcid input{padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);min-width:230px}
.skel{position:relative;overflow:hidden;color:transparent!important;background:var(--border);border-radius:6px;animation:p 1.2s infinite alternate}
@keyframes p{from{opacity:.45}to{opacity:.9}}
@media (max-width:1020px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.nav{display:none}}
@media (max-width:520px){.chart-foot{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="top"><div class="wrap top-in">
  <a class="brand" href="/abertura.html"><img src="/img/isotipo.svg" alt="" /><span class="wm"><b>Lattes</b><i>DATA</i></span></a>
  <nav class="nav" aria-label="Principal"><a class="on" href="/abertura.html">Início</a><a href="/">Enviar documentos</a></nav>
  <div class="top-r"><a href="/logout">Sair</a><div class="avatar" id="av">·</div></div>
</div></header>

<main class="wrap">
  <section class="profile">
    <div class="avatar" id="av2">·</div>
    <div class="who">
      <h1>Olá, <em id="nome">…</em></h1>
      <p id="status">Carregando seus indicadores…</p>
      <div class="ids" id="ids"></div>
    </div>
    <div class="actions"><a class="btn btn-p" href="/">＋ Enviar documento</a></div>
  </section>
  <div id="banner"></div>

  <div class="grid">
    <div>
      <section class="kpis" id="kpis" aria-label="Indicadores"></section>

      <section class="card chart-card">
        <div class="sec-h"><h2 id="chart-title">Produção por ano</h2>
          <div class="seg" role="group" aria-label="Período"><button data-n="5" class="on">5 anos</button><button data-n="0">11 anos</button></div></div>
        <svg id="chart" viewBox="0 0 700 210" preserveAspectRatio="none" role="img" aria-label="Gráfico por ano"></svg>
        <div class="chart-foot" id="foot"></div>
        <p class="src" id="src"></p>
      </section>

      <section class="card">
        <div class="sec-h"><h2>Citações recentes</h2></div>
        <div id="feed"><p class="empty">Carregando…</p></div>
      </section>
    </div>

    <aside class="side">
      <section class="card"><h2>Obras mais citadas</h2><div id="top"><p class="empty">Carregando…</p></div></section>
      <section class="card"><h2>Onde você é citado</h2><div id="vei"><p class="empty">Carregando…</p></div></section>
      <section class="card"><h2>Seus envios no LattesData</h2><div id="env"><p class="empty">Carregando…</p></div></section>
    </aside>
  </div>
</main>
<script src="/abertura.js"></script>
</body>
</html>
