<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contribuições para o projeto — LattesData</title><link rel="stylesheet" href="/fonts/fonts.css"><style>body{margin:0;background:#f5f8fa;color:#10233d;font:15px/1.5 Inter,Arial,sans-serif}.wrap{width:min(760px,calc(100% - 32px));margin:auto;padding:32px 0 64px}.card{background:#fff;border:1px solid #dfe7ee;border-radius:18px;padding:28px;margin-top:16px}.brand{color:#087f91;font-weight:800;letter-spacing:.05em}.muted{color:#617289}label{display:block;font-weight:800;margin:18px 0 7px}input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #dfe7ee;border-radius:9px;padding:11px;font:inherit;color:#10233d}textarea{min-height:180px;resize:vertical}button{margin-top:20px;border:0;border-radius:9px;background:#087f91;color:#fff;padding:12px 18px;font-weight:800;cursor:pointer}button:disabled{opacity:.6}.status{font-weight:700;color:#087f91}.error{color:#a33b2b}</style></head><body><main class="wrap"><div class="brand">LATTESDATA · ESPAÇO DE CONSTRUÇÃO</div><section class="card"><h1>Compartilhe uma ideia para o projeto</h1><p class="muted">Use este espaço para registrar sugestões, críticas, referências, fluxos ou materiais que possam melhorar a experiência do pesquisador.</p><form enctype="multipart/form-data"><label for="colaborador">Seu nome</label><input id="colaborador" name="colaborador" placeholder="Como devemos identificar você?" required><label for="tipo">Tipo de contribuição</label><select id="tipo" name="tipo"><option>Sugestão de produto</option><option>Crítica ou problema encontrado</option><option>Ideia de experiência do usuário</option><option>Referência ou inspiração</option><option>Material para análise</option><option>Outro</option></select><label for="texto">Sua contribuição</label><textarea id="texto" name="texto" placeholder="Descreva a ideia, o contexto e por que ela pode ser importante."></textarea><label for="arquivo">Anexar arquivo (opcional)</label><input id="arquivo" name="arquivo" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.doc,.docx,.txt,.md,.csv,.xlsx"><small class="muted">Tipos aceitos: PDF, imagens, documentos e planilhas. Limite: 10 MB.</small><br><button type="submit">Enviar contribuição</button><p class="status" role="status"></p></form></section></main><script>const form=document.querySelector('form'),status=document.querySelector('.status');form.addEventListener('submit',async e=>{e.preventDefault();const b=form.querySelector('button');b.disabled=true;b.textContent='Enviando…';status.className='status';status.textContent='';try{const r=await fetch('/api/pesquisa/colaborador',{method:'POST',body:new FormData(form)}),d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível enviar.');status.textContent='Contribuição recebida. Obrigado por ajudar a construir o projeto.';form.querySelectorAll('input,select,textarea,button').forEach(x=>x.disabled=true)}catch(err){status.className='status error';status.textContent=err.message;b.disabled=false;b.textContent='Enviar contribuição'}});</script></body></html>
