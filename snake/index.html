<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake</title>
<style>
  body{margin:0;background:#12141c;color:#e8e8f0;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;user-select:none}
  header{display:flex;gap:24px;align-items:center;padding:12px;font-size:18px}
  b{color:#ffd24a}
  canvas{background:#1b1e2b;border-radius:8px;max-width:96vw;max-height:76vh;touch-action:none}
  button{background:#3a4ad8;color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:15px;cursor:pointer}
  p{opacity:.7;font-size:14px;margin:8px;text-align:center}
</style>
</head>
<body>
<header>
  <span>Pontos <b id="pt">0</b></span>
  <span>Recorde <b id="rc">0</b></span>
  <button id="rs">Reiniciar</button>
</header>
<canvas id="c" width="420" height="420"></canvas>
<p>Setas ou WASD para mover (ou deslize na tela). Espaço pausa. Coma as maçãs e as paredes são portais: ao atravessar, você sai do lado oposto. Não bata em você mesmo.</p>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const N = 21, S = cv.width / N;
let cobra, dir, prox, maca, pontos, vivo, pausa, tick, timer;
let recorde = 0;
try { recorde = +localStorage.getItem('snakeRecorde') || 0; } catch (e) {}
document.getElementById('rc').textContent = recorde;

function iniciar() {
  cobra = [[10,10],[9,10],[8,10]];
  dir = [1,0]; prox = [1,0];
  pontos = 0; vivo = true; pausa = false; tick = 140;
  document.getElementById('pt').textContent = 0;
  novaMaca();
  clearInterval(timer);
  timer = setInterval(passo, tick);
  desenhar();
}

function novaMaca() {
  do { maca = [Math.floor(Math.random()*N), Math.floor(Math.random()*N)]; }
  while (cobra.some(s => s[0]===maca[0] && s[1]===maca[1]));
}

function passo() {
  if (!vivo || pausa) return;
  dir = prox;
  const h = [(cobra[0][0]+dir[0]+N)%N, (cobra[0][1]+dir[1]+N)%N];
  const come = h[0]===maca[0] && h[1]===maca[1];
  const corpo = come ? cobra : cobra.slice(0,-1);
  if (corpo.some(s => s[0]===h[0] && s[1]===h[1])) {
    vivo = false;
    if (pontos > recorde) {
      recorde = pontos;
      document.getElementById('rc').textContent = recorde;
      try { localStorage.setItem('snakeRecorde', recorde); } catch (e) {}
    }
    return desenhar();
  }
  cobra.unshift(h);
  if (come) {
    pontos++;
    document.getElementById('pt').textContent = pontos;
    novaMaca();
    if (tick > 70) { tick -= 4; clearInterval(timer); timer = setInterval(passo, tick); }
  } else cobra.pop();
  desenhar();
}

function desenhar() {
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle = '#ff5a5a';
  ctx.beginPath(); ctx.arc(maca[0]*S+S/2, maca[1]*S+S/2, S/2-3, 0, 7); ctx.fill();
  cobra.forEach((s,i) => {
    ctx.fillStyle = i ? '#3ddc84' : '#8dffb8';
    ctx.fillRect(s[0]*S+1, s[1]*S+1, S-2, S-2);
  });
  if (!vivo || pausa) {
    ctx.fillStyle = '#000a'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '28px system-ui';
    ctx.fillText(vivo ? 'Pausado' : 'Fim de jogo!', cv.width/2, cv.height/2);
    if (!vivo) { ctx.font = '16px system-ui'; ctx.fillText('Pressione Reiniciar ou Enter', cv.width/2, cv.height/2+30); }
  }
}

function virar(d) {
  if (d[0] === -dir[0] && d[1] === -dir[1]) return; // sem inverter
  prox = d;
}

addEventListener('keydown', e => {
  const m = {ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];
  if (m) { e.preventDefault(); virar(m); }
  else if (e.key === ' ') { e.preventDefault(); if (vivo) { pausa = !pausa; desenhar(); } }
  else if (e.key === 'Enter' && !vivo) iniciar();
});

let sx, sy;
cv.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
cv.addEventListener('pointerup', e => {
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.max(Math.abs(dx),Math.abs(dy)) < 20) { if (!vivo) iniciar(); return; }
  if (Math.abs(dx) > Math.abs(dy)) virar([Math.sign(dx),0]); else virar([0,Math.sign(dy)]);
});

document.getElementById('rs').onclick = iniciar;
iniciar();
</script>
</body>
</html>
